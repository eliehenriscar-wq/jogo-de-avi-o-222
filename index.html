<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Avião</title>
  <style>
    body { margin:0; }
    canvas {
      background: url('pista.png') no-repeat center;
      background-size: cover;
      display: block;
      margin: auto;
      border: 2px solid black;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="600" height="800"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Avião
    const planeImg = new Image();
    planeImg.src = "plane.png"; // precisa ter asas e estar orientado para frente
    const plane = { x: canvas.width/2-25, y: canvas.height-120, width: 50, height: 50 };

    // Balas, inimigos e pontuação
    let bullets = [];
    let enemies = [];
    let score = 0;

    // Controles
    document.addEventListener("keydown", (e) => {
      if(e.key === "ArrowUp") plane.y -= 15;
      if(e.key === "ArrowDown") plane.y += 15;
      if(e.key === "ArrowLeft") plane.x -= 15;
      if(e.key === "ArrowRight") plane.x += 15;
      if(e.code === "Space") {
        bullets.push({x: plane.x+plane.width/2-2, y: plane.y});
      }
    });

    // Criar inimigos
    function spawnEnemy() {
      enemies.push({x: Math.random()*(canvas.width-40), y: 0, width: 40, height: 40});
    }
    setInterval(spawnEnemy, 2000);

    // Loop principal
    function update() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(planeImg, plane.x, plane.y, plane.width, plane.height);

      // Balas
      bullets.forEach((b, i) => {
        b.y -= 8;
        ctx.fillStyle = "red";
        ctx.fillRect(b.x, b.y, 4, 10);
        if(b.y < 0) bullets.splice(i,1);
      });

      // Inimigos
      enemies.forEach((en, i) => {
        en.y += 3;
        ctx.fillStyle = "black";
        ctx.fillRect(en.x, en.y, en.width, en.height);

        // Colisão com avião
        if(en.x < plane.x+plane.width &&
           en.x+en.width > plane.x &&
           en.y < plane.y+plane.height &&
           en.y+en.height > plane.y) {
             alert("Game Over! Pontuação: " + score);
             document.location.reload();
        }

        // Colisão com balas
        bullets.forEach((b, j) => {
          if(b.x < en.x+en.width &&
             b.x+4 > en.x &&
             b.y < en.y+en.height &&
             b.y+10 > en.y) {
               enemies.splice(i,1);
               bullets.splice(j,1);
               score += 10;
          }
        });
      });

      // Pontuação
      ctx.fillStyle = "blue";
      ctx.font = "20px Arial";
      ctx.fillText("Pontuação: " + score, 10, 30);

      requestAnimationFrame(update);
    }
    update();
  </script>
</body>
</html>
